<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>见机 · 八字排盘结果页 · 统一视觉原型 v2</title>
<!--
  设计假设：保留第一版的信息架构与交互，只统一视觉系统。
  方向：克制的新中式工具感；墨纸为底、金色表示当前状态、朱砂表示风险、五行色只承担数据语义。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   见机 · 八字排盘结果页 高保真重构原型（单文件）
   主题令牌取自 src/theme（阴 yin / 阳 yang），点按太极切换阴阳
   微动效仅用于干支入场和五行计数，避免干扰长内容阅读
   ============================================================ */
:root{
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --SX:480px;
}
[data-theme="yin"]{
  --bg:#11120F; --bg2:#171814; --card:#1C1D19; --elev:#23241F; --input:#171814;
  --tx:#E4E1D8; --tx2:#AAA69A; --tx3:#77756D; --head:#F7F4EA;
  --gold:#C8A94F; --gold-l:#E0C77B; --gold-d:#8B7337;
  --red:#B85B4B; --red-l:#D47666; --jade:#628C74; --jade-d:#456754;
  --bd:#2A2B26; --bd2:#3A3B33;
  --metal:#D2AA48; --wood:#62A36E; --water:#6489C4; --fire:#D26452; --earth:#A27C50;
  --on-gold:#17130A;
  --page:#0B0C0A; --page2:#151610;
  --frame1:#34352F; --frame2:#141510;
  --shadow:rgba(0,0,0,.48); --ovl:rgba(5,6,4,.72);
}
[data-theme="yang"]{
  --bg:#F3EFE6; --bg2:#ECE6DA; --card:#FBF8F1; --elev:#F2ECE0; --input:#ECE5D8;
  --tx:#26231D; --tx2:#665F53; --tx3:#8C8476; --head:#171510;
  --gold:#8F712F; --gold-l:#B99649; --gold-d:#6C5422;
  --red:#A95143; --red-l:#C96859; --jade:#4F8065; --jade-d:#376049;
  --bd:#DDD5C7; --bd2:#C8BDAA;
  --metal:#9B782C; --wood:#487D55; --water:#416D9D; --fire:#AD5143; --earth:#806344;
  --on-gold:#FFFDF7;
  --page:#E5DED1; --page2:#EFE8DB;
  --frame1:#4A453C; --frame2:#231F18;
  --shadow:rgba(54,45,30,.22); --ovl:rgba(30,26,19,.46);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--page);color:var(--tx);transition:background .35s,color .35s;overflow-x:hidden;text-rendering:optimizeLegibility}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,var(--page2),transparent 34%);opacity:.72}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- 页面骨架（全屏自适应版，去手机外框） ---------- */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;position:relative}
[data-theme="yang"] .ahd-ic .taiji-svg{transform:rotate(180deg)}
.ahd-ic .taiji-svg{transition:transform .6s cubic-bezier(.25,.8,.3,1)}
.app-frame{position:relative;width:100%;max-width:var(--SX);background:var(--bg);border-radius:20px;border:1px solid var(--bd2);transition:background .35s;box-shadow:0 24px 70px -38px var(--shadow);overflow:clip}
.app-cap{margin-top:16px;font-size:10.5px;letter-spacing:1px;color:var(--tx3);text-align:center;line-height:1.8}

/* ---------- 屏幕骨架（全屏流式） ---------- */
.vp{position:relative;overflow:visible;padding:0 0 16px}
.vp::-webkit-scrollbar{display:none}
.grain{display:none}
.press{transition:transform .18s ease,opacity .18s ease}
.press:active{transform:scale(.96);opacity:.85}

/* ---------- App 头部（sticky，含分段页签） ---------- */
.ahd{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:11px 14px;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);border-top-left-radius:20px;border-top-right-radius:20px}
.ahd-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--tx2);border-radius:10px;flex:none;transition:background .18s,color .18s}
.ahd-back:hover,.ahd-ic:hover{background:var(--elev);color:var(--head)}
.ahd-title{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:1.5px;color:var(--head);flex:none}
.ahd-sp{flex:1}
.ahd-ai{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold-l);font-size:12px;font-weight:700;letter-spacing:.8px;padding:8px 11px;border-radius:10px;border:1px solid color-mix(in srgb,var(--gold) 36%,var(--bd));position:relative;overflow:hidden;flex:none;transition:background .18s,border-color .18s,transform .18s}
.ahd-ai:hover{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:var(--gold-d)}
.ahd-ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--tx2);border-radius:10px;flex:none;transition:background .18s,color .18s}
.ahd-ic.on{color:var(--gold)}
/* 分段页签：顶栏正下方一行（sticky） */
.stabs{position:sticky;top:59px;z-index:50;display:flex;margin:0;padding:0 14px;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.stab{flex:1;position:relative;min-height:46px;padding:0;text-align:center;font-size:13px;font-weight:500;letter-spacing:.5px;color:var(--tx3);border-radius:0;transition:color .25s;z-index:1;background:transparent;border:none}
.stab.on{color:var(--gold)}
.stab-thumb{position:absolute;left:14px;bottom:-1px;height:2px;width:calc((100% - 28px)/3);border-radius:2px;background:var(--gold);border:0;transition:transform .35s cubic-bezier(.3,.8,.3,1);z-index:2;pointer-events:none}

/* ---------- 克制的内容入场 ---------- */
.st-char{display:inline-block;opacity:0;transform:translateY(7px);filter:none;animation:stin .45s cubic-bezier(.22,.8,.3,1) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes stin{to{opacity:1;transform:none;filter:blur(0)}}
/* ---------- 命局摘要 Hero ---------- */
.mingdie{margin:16px 0 0;border-radius:16px;background:var(--card);border:1px solid var(--bd2);padding:18px 16px 16px;position:relative}
.mingdie::before{display:none}
.md-top{display:flex;align-items:center;justify-content:space-between}
.md-title{font-family:var(--serif);font-size:10.5px;letter-spacing:2px;color:var(--tx3)}
.md-seal{width:30px;height:30px;background:var(--red);color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:10px;font-weight:700;letter-spacing:1px;line-height:1.1;padding:3px;text-align:center}
.md-name{margin-top:9px;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--head);letter-spacing:1.5px}
.md-name i{display:block;font-style:normal;font-family:var(--sans);font-size:10.5px;color:var(--tx3);letter-spacing:.4px;margin:5px 0 0}
.md-gzrow{display:flex;align-items:stretch;justify-content:space-between;gap:4px;margin-top:15px;padding:13px 0 11px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.md-gz{display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;border-radius:10px}
.md-gz .gz-pair{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:1px;line-height:1.15}
.md-gz .gz-lab{font-size:9px;color:var(--tx3);letter-spacing:.8px}
.md-gz .gz-ss{font-size:9.5px;color:var(--gold);letter-spacing:1px}
.md-gz.day{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.md-gz.day .gz-pair{border-bottom:0;padding-bottom:0}
.md-sep{display:none}
.md-pattern{margin-top:12px;display:flex;justify-content:flex-start;gap:6px;align-items:center;font-size:10px;color:var(--tx2);letter-spacing:.6px;line-height:1.7;padding:9px 11px;border-left:2px solid var(--gold);border-radius:0 8px 8px 0;background:var(--elev)}
.md-pattern b{font-family:var(--serif);color:var(--gold);font-weight:600;letter-spacing:.6px}
.metal{color:var(--metal)}.wood{color:var(--wood)}.water{color:var(--water)}.fire{color:var(--fire)}.earth{color:var(--earth)}
.md-meta{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:5px}
.md-meta div{font-size:10.5px;color:var(--tx2);letter-spacing:1px;display:flex;justify-content:space-between}
.md-meta div i{font-style:normal;color:var(--tx3)}
/* 命盘信息带（宫位 + 排盘口径） */
.md-sep-band{display:flex;align-items:center;gap:12px;margin:16px 0 2px}
.md-sep-band i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent);opacity:.7}
.md-sep-band span{font-family:var(--serif);font-size:10px;color:var(--gold);letter-spacing:2px;flex:none}
.md-band{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;padding:8px 2px 2px}
.md-band-col{display:flex;flex-direction:column;gap:0}
.md-band-col>h6{font-family:var(--serif);font-size:9.5px;font-weight:500;color:var(--tx3);letter-spacing:2px;margin:0 0 2px;padding-bottom:6px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}
.md-band-col>h6::before{content:"";width:12px;height:1px;background:var(--gold)}
.md-c{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 5px;border-bottom:1px dashed var(--bd)}
.md-c:last-child{border-bottom:none}
.md-c i{font-style:normal;font-size:10.5px;color:var(--tx3);letter-spacing:2px}
.md-c b{font-family:var(--serif);font-size:12px;font-weight:500;color:var(--head);letter-spacing:1px;text-align:right;line-height:1.2}
/* ---------- 五行条 ---------- */
.wuxing{margin:10px 0 0;border-radius:14px;background:var(--card);border:1px solid var(--bd);padding:14px 15px}
.wx-head{display:flex;justify-content:space-between;align-items:baseline}
.wx-t{font-family:var(--serif);font-size:13px;color:var(--head);letter-spacing:1px}
.wx-h{font-size:9.5px;color:var(--tx3);letter-spacing:.4px}
.wx-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:10px;background:var(--elev)}
.wx-bar i{display:block;height:100%;animation:bar 1s cubic-bezier(.22,.8,.3,1) both}
@keyframes bar{from{width:0}}
.bg-metal{background:var(--metal)}.bg-wood{background:var(--wood)}.bg-water{background:var(--water)}.bg-fire{background:var(--fire)}.bg-earth{background:var(--earth)}
.wx-grid{display:grid;grid-template-columns:repeat(5,1fr);margin-top:11px;border-top:1px solid var(--bd);padding-top:9px}
.wx-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.wx-el{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2);letter-spacing:1px}
.wx-num{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1}
.wx-st{font-size:9px;letter-spacing:.8px;padding:3px 7px;border-radius:6px;border:0;background:var(--elev);color:var(--tx3)}
.wx-st.hot{color:var(--gold);border-color:var(--gold-d)}
.wx-st.warm{color:var(--jade);border-color:var(--jade-d)}
.wx-hint{margin-top:10px;font-size:9.5px;color:var(--tx3);letter-spacing:.3px;text-align:left;line-height:1.7}
.wx-hint b{color:var(--tx2);font-weight:500}

/* ---------- 通用区块 ---------- */
.sec{padding:0 14px}
.blk{animation:rise .5s cubic-bezier(.22,.8,.3,1) both;animation-delay:calc(var(--d,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;transition:background .35s,border-color .35s}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--head);letter-spacing:1px}
.sec-hint{font-size:10px;color:var(--tx3);letter-spacing:.4px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--bd);gap:12px}
.row:last-child{border-bottom:none}
.rk{font-size:12px;color:var(--tx3);letter-spacing:.6px;flex:none}
.rv{font-size:12.5px;color:var(--head);letter-spacing:.5px;text-align:right;line-height:1.8}
.rv.dim{color:var(--tx2)}
.pad16{padding:4px 16px}
.jq-line{display:flex;align-items:center;gap:0;margin:6px 6px 2px;position:relative;padding:18px 4px 8px}
.jq-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;flex:none;width:64px}
.jq-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--card)}
.jq-dot.hollow{background:var(--card);border:2px solid var(--gold-d)}
.jq-name{font-size:10px;color:var(--tx2);letter-spacing:1px}
.jq-date{font-size:8.5px;color:var(--tx3)}
.jq-link{flex:1;height:1px;background:var(--bd2);position:relative;top:-16px}
.jq-born{position:absolute;left:50%;transform:translateX(-50%);top:0;font-size:8.5px;color:var(--gold);letter-spacing:1px;white-space:nowrap}
/* ---------- 排盘矩阵 ---------- */
.mtx{border-radius:14px;overflow:hidden}
.mtx-row{display:grid;border-bottom:1px solid var(--bd)}
.mtx-row:last-child{border-bottom:none}
.mtx-cell{padding:10px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;min-width:0}
.mtx-lab{font-size:10px;color:var(--tx2);letter-spacing:.5px;background:var(--elev)}
.mtx-hd{font-size:10.5px;color:var(--tx2);letter-spacing:1px;font-weight:600}
.mtx-hd.luck{color:var(--gold)}
.mtx-ss{font-size:11.5px;font-weight:600;color:var(--head);letter-spacing:1px}
.mtx-gz{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.2}
.mtx-sm{font-size:9.5px;color:var(--tx2);line-height:1.7;letter-spacing:.3px}
.mtx-xm{font-size:8.5px;color:var(--tx3);line-height:1.75;letter-spacing:.3px}
.mtx-cell.sel-col{background:color-mix(in srgb,var(--gold) 10%,transparent);box-shadow:inset 0 2px 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.mtx-cell.day-col{background:color-mix(in srgb,var(--gold) 6%,transparent)}

/* ---------- 运限轨道 ---------- */
.track{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.tk{flex:none;width:76px;border-radius:10px;background:var(--card);border:1px solid var(--bd);padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,border-color .2s,transform .2s;position:relative}
.tk-top{font-size:9px;color:var(--tx3);letter-spacing:.5px}
.tk-sub{font-size:8.5px;color:var(--tx3)}
.tk-gz{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--head);letter-spacing:1px;line-height:1.3}
.tk-ter{font-size:7.5px;color:var(--tx3);letter-spacing:.3px}
.tk.on{border-color:var(--gold-d);background:color-mix(in srgb,var(--gold) 10%,var(--card));box-shadow:none}
.tk.on .tk-gz{color:var(--gold)}
.tk.cur::after{content:"今";position:absolute;top:-6px;right:-3px;background:var(--jade);color:#fff;font-size:8px;padding:2px 5px;border-radius:4px;letter-spacing:.5px;font-family:var(--serif)}
.qy-band{display:flex;gap:7px;margin-top:4px}
.qy{flex:1;text-align:center;font-size:10px;letter-spacing:2px;padding:7px 0;border-radius:9px;background:var(--elev);color:var(--tx3);border:1px solid var(--bd)}
.qy.hot{color:var(--gold);border-color:var(--gold-d);background:transparent}
.qy.warm{color:var(--jade)}

/* ---------- 开关（流年大运 / 胎命身） ---------- */
.pswitch{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 4px;padding:5px 10px;width:max-content;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.psw-lab{font-size:11.5px;color:var(--tx3);letter-spacing:.5px;transition:color .3s}
.psw-lab.on{color:var(--gold);font-weight:600}
.psw{width:52px;height:28px;border-radius:14px;background:var(--elev);border:1px solid var(--bd2);position:relative;transition:background .3s}
.psw-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--gold);transition:transform .35s cubic-bezier(.3,.8,.3,1);box-shadow:0 2px 8px -2px var(--gold-d)}
.pswitch.taiming .psw-thumb{transform:translateX(24px)}

/* ---------- 神煞 / 干支分层 ---------- */
.ss-block{margin-top:10px}
.ss-sec{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--bd);align-items:baseline}
.ss-sec:last-child{border-bottom:none}
.ss-t{flex:none;width:76px;font-size:10.5px;color:var(--gold);letter-spacing:2px}
.ss-v{font-size:11.5px;color:var(--tx2);line-height:1.9;letter-spacing:.5px}
.rel-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0 4px}
.rel{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;font-size:9.5px;color:var(--tx3);letter-spacing:.3px;background:var(--card)}
.rel b{font-family:var(--serif);color:var(--gold);font-weight:600}
.rel.he{border-color:var(--jade-d)} .rel.he b{color:var(--jade)}
.rel.chong{border-color:var(--red)} .rel.chong b{color:var(--red-l)}
.entry{width:100%;display:flex;align-items:center;gap:12px;padding:14px 15px;text-align:left}
.entry b{flex:1;font-size:13px;color:var(--head);font-weight:600;letter-spacing:2px}
.entry i{font-style:normal;font-size:10px;color:var(--tx3);letter-spacing:1px}
.entry svg{color:var(--gold)}
.sel-line{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px;font-size:10.5px;color:var(--tx3);letter-spacing:.4px;line-height:1.7}
.sel-line b{color:var(--gold);font-weight:600}
/* ---------- 专业细盘头部 strip（含内嵌 panelMode 切换） ---------- */
.chart-strip{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:16px 14px 0;padding:14px 15px;border:1px solid var(--bd2);border-radius:14px;background:var(--card)}
.cs-main{flex:1;min-width:0}
.cs-name{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--head);letter-spacing:1px;line-height:1.3}
.cs-line{font-size:10.5px;color:var(--tx2);letter-spacing:.3px;line-height:1.7;margin-top:3px}
.cs-line i{font-style:normal;color:var(--tx3)}
.cs-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.cs-mz{font-size:9px;color:var(--tx3);letter-spacing:2px;text-align:right}
/* 内嵌于命局头部的 panelMode switch（紧凑版） */
.pms{position:relative;display:flex;align-items:center;width:108px;height:30px;border-radius:9px;background:var(--elev);border:1px solid var(--bd2);overflow:hidden}
.pms-thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:7px;background:var(--gold);transition:transform .35s cubic-bezier(.3,.8,.3,1);box-shadow:none;z-index:0}
.pms.taiming .pms-thumb{transform:translateX(78px)}
.pms-labs{position:relative;z-index:1;display:flex;width:100%;height:100%;align-items:center;justify-content:space-between;padding:0 8px}
.pms-lab{font-size:10.5px;color:var(--tx3);letter-spacing:.5px;transition:color .3s;flex:1;text-align:center}
.pms.taiming .pms-lab.l,.pms:not(.taiming) .pms-lab.r{color:transparent}

const NAYIN30=['海中金','炉中火','大林木','路旁土','剑锋金','山头火','涧下水','城头土','白蜡金','杨柳木','泉中水','屋上土','霹雳火','松柏木','长流水','沙中金','山下火','平地木','壁上土','金箔金','覆灯火','天河水','大驿土','钗钏金','桑柘木','大溪水','沙中土','天上火','石榴木','大海水'];
const CHANGSHENG_START={甲:['亥',1],乙:['午',-1],丙:['寅',1],丁:['酉',-1],戊:['寅',1],己:['酉',-1],庚:['巳',1],辛:['子',-1],壬:['申',1],癸:['卯',-1]};

function isYang(s){ return STEMS.indexOf(s)%2===0; }
function shiShenOf(target){
  const dEl=STEM_EL[DAY_MASTER], tEl=STEM_EL[target]||ZHI_EL[target];
  const dYin=!isYang(DAY_MASTER);
  const tYin = STEM_EL[target] ? !isYang(target) : !isYang(ZHI_BENQI[target]);
  const samePol = dYin===tYin;
  const order=['wood','fire','earth','metal','water'];
  const d=order.indexOf(dEl), t=order.indexOf(tEl);
  if(d===t) return samePol?'比肩':'劫财';
  if((d+1)%5===t) return samePol?'食神':'伤官';   // 我生
  if((d+4)%5===t) return samePol?'偏印':'正印';   // 生我
  if((d+2)%5===t) return samePol?'偏财':'正财';   // 我克
  return samePol?'七杀':'正官';                    // 克我
}
function branchShiShen(z){ return shiShenOf(ZHI_BENQI[z]); }
function jiaziIndex(g,z){
  const gi=STEMS.indexOf(g), zi=ZHI.indexOf(z);
  for(let k=0;k<6;k++){ const n=gi+10*k; if(n%12===zi) return n; }
  return 0;
}
function naYin(ganzhi){ return NAYIN30[Math.floor(jiaziIndex(ganzhi[0],ganzhi[1])/2)]; }
function kongWang(ganzhi){
  const gi=STEMS.indexOf(ganzhi[0]), zi=ZHI.indexOf(ganzhi[1]);
  const start=(zi-gi+12)%12;

}

  const [start,dir]=CHANGSHENG_START[gan];
  const si=ZHI.indexOf(start), zi=ZHI.indexOf(zhi);
  const steps=((zi-si)*dir%12+12)%12;
  return CS_SEQ[steps];
}
function xingYun(zhi){ return changSheng(DAY_MASTER,zhi); }
function elOf(ch){ return STEM_EL[ch]||ZHI_EL[ch]; }

  const startAge=dy.ageStart, startY=dy.start;

function curDaYun(){ return DA_YUN[S.selDaYun]; }
function curLiuNian(){ return curDaYun().liunian[S.selLiuNian]; }
function luckCol(label,ganzhi,tag){
  const g=ganzhi[0], z=ganzhi[1];
  return { label, ganzhi, tag,
    main: shiShenOf(g),
    sub: CANGGAN[z].map(x=>`${x}${shiShenOf(x)}`),
    xy: xingYun(z), zz: changSheng(g,z), kw: kongWang(ganzhi), ny: naYin(ganzhi),
  };
}
function natalCol(p){
  return { label:p.lab, ganzhi:p.gz, tag:p.key,
    main: p.main,
    sub: CANGGAN[p.gz[1]].map(x=>`${x}${shiShenOf(x)}`),
    xy: xingYun(p.gz[1]), zz: changSheng(p.gz[0],p.gz[1]), kw: kongWang(p.gz), ny: naYin(p.gz),
    shensha: SHENSHA_PILLARS[p.key],
  };
}
function proMatrix(columns, selIdx){
  const cols=`46px repeat(${columns.length},1fr)`;
  const cell=(c,content,cls,i)=>`<div class="mtx-cell ${cls}${i===selIdx?' sel-col':''}${c.tag==='day'?' day-col':''}">${content}</div>`;
  const row=(lab,fn,cls)=>`<div class="mtx-row" style="grid-template-columns:${cols}">
    <div class="mtx-cell mtx-lab">${lab}</div>${columns.map((c,i)=>cell(c,fn(c,i),cls,i)).join('')}</div>`;
  return `<div class="card mtx pro-mtx blk" style="--d:1;margin-top:12px">
    ${row('运位',(c,i)=>`<span class="mtx-hd${i===selIdx?' luck':''}">${c.label}</span>`,'')}
    ${row('主星',c=>`<span class="mtx-ss">${c.main}</span>`,'')}
    ${row('天干',c=>`<span class="mtx-gz ${elOf(c.ganzhi[0])}">${c.ganzhi[0]}</span>`,'')}
    ${row('地支',c=>`<span class="mtx-gz ${elOf(c.ganzhi[1])}">${c.ganzhi[1]}</span>`,'')}
    ${row('藏干',c=>c.sub.map(s=>`<span class="${elOf(s[0])}">${s[0]}</span>${s.slice(1)}`).join('<br>'),'mtx-xm')}
    ${row('星运',c=>`<span class="mtx-ss">${c.xy}</span>`,'')}
    ${row('自坐',c=>`<span class="mtx-ss">${c.zz}</span>`,'')}
    ${row('空亡',c=>`<span class="mtx-ss">${c.kw}</span>`,'')}
    ${row('纳音',c=>`<span class="mtx-sm">${c.ny}</span>`,'')}
    ${row('神煞',c=>`<span class="mtx-xm">${(c.shensha||[]).slice(0,3).join('<br>')||'—'}</span>`,'')}
  </div>`;
}

const AI_STAGES=['基础分析','前事核验','未来五年','专题追问'];
function aiText(){
  const dy=curDaYun(), ln=curLiuNian();
  let t=`己土日主，生于卯月，七杀当令；年月两透辛金食神，制杀有力，时柱壬申伤官生财，秀气流通 —— 食神制杀格成。\n\n主聪慧外露而有担当，宜凭技艺立身；财星归时，晚岁衣食无虞。\n\n现行 ${dy.gz} 大运（${dy.ages} 岁）：运干${dy.gz[0]}为${shiShenOf(dy.gz[0])}，运支${dy.gz[1]}为${branchShiShen(dy.gz[1])}之地，根基与名位并见。\n\n${ln.year} ${ln.gz} 流年：岁干${ln.gz[0]}为${shiShenOf(ln.gz[0])}，岁支${ln.gz[1]}为${branchShiShen(ln.gz[1])}之乡。`;
  if(ln.gz==='丙午') t+=`丙火正印透干，丙辛合水化财，利文书、进修与置产；唯卯午相破动月令，春夏之交宜守不宜攻。`;
  else t+=`宜循大运之势，参酌进退，顺势而为。`;
  t+=`\n（以上为原型演示文案）`;
  return t;
}
function openAI(){
  mr.innerHTML=`<div class="ovl" data-act="ai-close"><div class="ai-modal" role="dialog" aria-modal="true" aria-label="AI 分析">
    <div class="ai-hd">${ic('spark',18)}<b>AI 分析</b><span class="ai-live">流式演示</span>
      <button class="ahd-ic press" data-act="ai-close" aria-label="关闭 AI 分析">${ic('close',18)}</button></div>
    <div class="ai-stages">${AI_STAGES.map((s,i)=>`<span class="ai-stage${i===S.aiStage?' on':i<S.aiStage?' done':''}">${i+1} ${s}</span>`).join('')}</div>
    <div class="ai-body" id="ai-body"><span class="caret"></span></div>
    <div class="ai-chips">${['格局怎么看','用神怎么取','今年应期'].map(c=>`<button class="chip-b press" data-act="toast" data-msg="「${c}」· 原型演示">${c}</button>`).join('')}</div>
    <div class="ai-input"><input aria-label="继续追问" placeholder="继续追问…" readonly><button class="press" data-act="toast" data-msg="流式追问 · 原型演示" aria-label="发送追问">${ic('send',15)}</button></div>
  </div></div>`;
  const body=document.getElementById('ai-body'), text=aiText();
  let i=0;
  if(streamTimer) clearInterval(streamTimer);
  streamTimer=setInterval(()=>{
    i+=2;
    body.innerHTML=esc(text.slice(0,i))+'<span class="caret"></span>';
    body.scrollTop=body.scrollHeight;
    if(i>=text.length){clearInterval(streamTimer);streamTimer=null;body.innerHTML=esc(text);}
  },26);
}
function closeModal(){ if(streamTimer){clearInterval(streamTimer);streamTimer=null;} mr.innerHTML=''; }
function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.setAttribute('role','status'); el.textContent=msg;
  tr.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

/* ---------- 智能干支图示（关系图谱） ---------- */
function gNode(x,y,lab,ganzhi,accent){
  const stroke = accent ? 'var(--gold)' : 'var(--bd2)';
  const sw = accent ? 1.4 : 1;
  return `<g>
    <rect x="${x-34}" y="${y-26}" width="68" height="56" rx="13" fill="var(--card)" stroke="${stroke}" stroke-width="${sw}"/>
    <text x="${x}" y="${y-9}" text-anchor="middle" class="g-node-lab" fill="var(--tx3)">${lab}</text>
    <text x="${x-11}" y="${y+20}" text-anchor="middle" class="g-node-gz" style="fill:var(--${elOf(ganzhi[0])})">${ganzhi[0]}</text>
    <text x="${x+11}" y="${y+20}" text-anchor="middle" class="g-node-gz" style="fill:var(--${elOf(ganzhi[1])})">${ganzhi[1]}</text>
  </g>`;
}
function gArc(x1,y1,x2,y2,bend,color,dash,label,labDy){
  const mx=(x1+x2)/2, my=(y1+y2)/2+bend;
  return `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="1.5" ${dash?'stroke-dasharray="5 4"':''} opacity=".85"/>
  <text x="${mx}" y="${my+(labDy||-4)}" text-anchor="middle" font-size="9.5" fill="${color}" letter-spacing="1">${label}</text>`;
}
function openGraph(){
  const dy=curDaYun(), ln=curLiuNian();
  const JADE='var(--jade)', GOLD='var(--gold)', RED='var(--red-l)';
  const svg=`<svg viewBox="0 0 360 246" style="width:100%;display:block">
    ${gArc(90,64,216,146,10,JADE,false,'甲己合')}
    ${gArc(272,64,64,146,-34,JADE,false,'丙辛合')}
    ${gArc(272,64,136,146,-18,JADE,false,'')}
    ${gArc(140,180,272,90,40,RED,true,'卯午破',14)}
    ${gArc(220,180,300,180,-26,GOLD,true,'巳申合刑',-8)}
    ${gNode(90,50,'大运',dy.gz,true)}
    ${gNode(272,50,'流年',ln.gz,true)}
    ${gNode(60,164,'年柱','辛巳',false)}
    ${gNode(140,164,'月柱','辛卯',false)}
    ${gNode(220,164,'日柱','己巳',true)}
    ${gNode(300,164,'时柱','壬申',false)}
  </svg>`;
  mr.innerHTML=`<div class="ovl" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="智能干支图示">
    <div class="sheet-hd"><b>智能干支图示</b><button class="ahd-ic press" data-act="sheet-close" aria-label="关闭干支图示">${ic('close',18)}</button></div>
    <div class="sheet-sub">${dy.gz} 大运 · ${ln.year} ${ln.gz} 流年 与命局的关系图谱</div>
    <div class="graph-wrap">${svg}</div>
    <div class="g-legend">
      <span><i class="g-dot" style="background:var(--jade)"></i>合化</span>
      <span><i class="g-dot" style="background:var(--gold)"></i>合刑</span>
      <span><i class="g-dot" style="background:var(--red-l)"></i>冲破</span>
    </div>
    <div class="rel-list">
      <div class="rel-row"><b style="color:var(--jade)">甲己合土</b><span>运干甲与日主己相合 —— 官来就我，此运名位可得。</span></div>
      <div class="rel-row"><b style="color:var(--jade)">丙辛合水</b><span>流年干丙与年月两辛争合 —— 印化为财，利文书交易。</span></div>
      <div class="rel-row"><b style="color:var(--gold)">巳申合刑</b><span>日支时支合中带刑 —— 夫妻宫内藏磨砺，先难后易。</span></div>
      <div class="rel-row"><b style="color:var(--red-l)">卯午相破</b><span>月支与流年支相破 —— 春夏之交防计划受阻，宜守。</span></div>
    </div>
  </div></div>`;
}

/* ---------- 修改信息 ---------- */
function openEdit(){
  mr.innerHTML=`<div class="ovl" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="修改信息">
    <div class="sheet-hd"><b>修改信息</b><button class="ahd-ic press" data-act="sheet-close" aria-label="关闭修改信息">${ic('close',18)}</button></div>
    <div class="sheet-sub">原型仅作交互演示，不会写入任何数据</div>
    <div class="edit-field"><label for="ed-name">称呼</label><input id="ed-name" class="input" value="${esc(S.name)}" maxlength="8"></div>
    <div class="edit-field"><label for="ed-place">出生地</label><input id="ed-place" class="input" value="${esc(S.place)}" maxlength="12"></div>
    <button class="btn-gold press" data-act="edit-save">保存</button>
  </div></div>`;
}

/* ---------- 导出 Markdown（真实下载） ---------- */
function exportMD(){
  const dy=curDaYun(), ln=curLiuNian();
  const lines=[
    `# 八字排盘 · ${S.name}`,'',
    `- 阳历：2001-03-17 09:20（真太阳时 09:02 · ${S.place} E114.06°）`,
    `- 农历：辛巳年二月廿三 · 申时 · 坤造`,'',
    `## 四柱`,'',
    `| | 年柱 | 月柱 | 日柱 | 时柱 |','|---|---|---|---|---|`,
    `| 主星 | 食神 | 食神 | 元女 | 正财 |`,
    `| 干支 | 辛巳 | 辛卯 | 己巳 | 壬申 |`,
    `| 纳音 | 白蜡金 | 松柏木 | 大林木 | 剑锋金 |`,'',
    `## 当前运限`,'',
    `- 大运：${dy.gz}（${dy.ages} 岁 · ${dy.start} 起）`,
    `- 流年：${ln.year} ${ln.gz}（${ln.age} 岁）`,'',
    `> 见机 · 原型导出演示`,
  ].join('\n');
  const blob=new Blob([lines],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bazi-命盘.md';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),800);
  toast('已导出 Markdown 文件');
}

/* ---------- 删除确认 ---------- */
function openConfirm(){
  mr.innerHTML=`<div class="confirm" data-act="confirm-close">
    <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-desc">
      <h5 id="delete-title">删除记录</h5>
      <p id="delete-desc">确定要删除此八字排盘记录吗？<br>删除后将无法恢复。</p>
      <div class="confirm-btns">
        <button class="press" data-act="confirm-close">取消</button>
        <button class="danger press" data-act="del-yes">删除</button>
      </div>
    </div>
  </div>`;
}


/* ============================================================
   渲染编排
   ============================================================ */
function render(){
  const sec = S.section==='basicInfo' ? secBasicInfo() : S.section==='basicChart' ? secBasicChart() : secProChart();
  vp.innerHTML = renderHeader() + renderTabs() + sec + `
    <div class="page-foot">
      <div class="rule"><i></i><b>◆</b><i></i></div>
      <div class="foot-motto">心诚则灵</div>
      <div class="foot-seal">见机 · 演示命例 · 数据仅作原型展示</div>
    </div>`;
  runCounts();
  vp.scrollTop = 0;
}
function runCounts(){
  vp.querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.dataset.count, t0=performance.now();
    function tick(t){
      const p=Math.min(1,(t-t0)/800);
      el.textContent=Math.round(target*(1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
/* ============================================================
   动作分发 + 主题 + 缩放适配 + 初始化
   ============================================================ */
const ACT={
  'toast':el=>toast(el.dataset.msg||'原型演示'),
  'back':()=>{window.scrollTo({top:0,behavior:'smooth'});toast('原型为单页展示');},
  'theme':()=>{toggleTheme();render();},
  'section':el=>{S.section=el.dataset.k;S.menu=false;render();vp.scrollTop=0;window.scrollTo({top:0,behavior:'smooth'});},
  'panel':()=>{S.panelMode=S.panelMode==='fortune'?'taiming':'fortune';render();},
  'privacy':el=>{S.privacy=!S.privacy;S.menu=false;render();toast(S.privacy?'已隐藏敏感信息':'已恢复显示');},
  'menu':()=>{S.menu=!S.menu;render();},
  'fav':()=>{S.fav=!S.fav;S.menu=false;render();toast(S.fav?'已收藏':'已取消收藏');},
  'edit':()=>{S.menu=false;render();openEdit();},
  'edit-save':()=>{
    const n=document.getElementById('ed-name'), p=document.getElementById('ed-place');
    if(n&&n.value.trim())S.name=n.value.trim();
    if(p&&p.value.trim())S.place=p.value.trim();
    closeModal();render();toast('已保存（演示）');
  },
  'export':()=>{S.menu=false;render();exportMD();},
  'del':()=>{S.menu=false;render();openConfirm();},
  'del-yes':()=>{closeModal();toast('已删除（演示）');},
  'confirm-close':(el,e)=>{if(e.target===el)closeModal();},
  'graph':()=>{openGraph();},
  'sheet-close':(el,e)=>{if(e.target===el||el.closest('.ahd-ic'))closeModal();},
  'ai':()=>{S.menu=false;render();openAI();},
  'ai-close':(el,e)=>{if(e.target===el||el.closest('.ahd-ic'))closeModal();},
  'sel-dayun':el=>{
    const i=+el.dataset.i;
    if(!DA_YUN[i].liunian){toast(`${DA_YUN[i].gz} 运 · 流年从略（演示）`);return;}
    S.selDaYun=i;S.selLiuNian=1;S.selLiuYue=i===2?6:0;render();
  },
  'sel-liunian':el=>{S.selLiuNian=+el.dataset.i;render();},
  'sel-liuyue':el=>{S.selLiuYue=+el.dataset.i;render();toast(`已选流月 ${liuYueOfYear(curLiuNian().gz[0])[S.selLiuYue].gz}`);},
};
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=ACT[el.dataset.act];
  if(fn)fn(el,e);
});
function toggleTheme(){
  const next=document.body.dataset.theme==='yang'?'yin':'yang';
  document.body.dataset.theme=next;
  try{localStorage.setItem('jj-theme',next);}catch(e){}
}
try{
  const saved=localStorage.getItem('jj-theme');
  if(saved==='yang'||saved==='yin'){
    document.body.dataset.theme=saved;
  }
}catch(e){}
render();
</script>
