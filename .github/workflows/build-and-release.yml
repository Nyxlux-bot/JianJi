name: EAS Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的现有版本标签，例如 v1.7.4'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 拉取完整代码历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. 生成中文版本说明
        id: changelog
        env:
          CURRENT_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          APP_VERSION=$(jq -r '.expo.version' app.json)
          if [ "$CURRENT_TAG" != "v${APP_VERSION}" ]; then
            echo "标签 ${CURRENT_TAG} 与应用版本 ${APP_VERSION} 不一致，停止发布。"
            exit 1
          fi

          CURATED_NOTES=".github/release-notes/${CURRENT_TAG}.md"
          if [ -f "$CURATED_NOTES" ]; then
            cp "$CURATED_NOTES" RELEASE_NOTES.md
            echo "使用 ${CURRENT_TAG} 专用版本说明"
            cat RELEASE_NOTES.md
            exit 0
          fi
          echo "未找到专用版本说明，按提交类型生成。"

          # 用 git describe 沿提交历史找上一个 tag，避免按时间排序出现重复
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "变更范围：${PREV_TAG} → ${CURRENT_TAG}"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges)
          else
            echo "未找到上一个 tag，使用最近 30 条提交"
            COMMITS=$(git log --oneline --no-merges -30)
          fi

          FEATURES=""
          FIXES=""
          OPTIMIZATIONS=""
          OTHERS=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG=$(echo "$line" | sed 's/^[0-9a-f]\{7,\} //')

            # 跳过纯版本 bump 提交
            echo "$MSG" | grep -qiE '^(chore:)?\s*(bump version|version to)' && continue

            if echo "$MSG" | grep -qiE '^(fix|bugfix)(\([^)]*\))?!?:'; then
              FIXES="${FIXES}\n- ${MSG}"
            elif echo "$MSG" | grep -qiE '^(feat|add)(\([^)]*\))?!?:'; then
              FEATURES="${FEATURES}\n- ${MSG}"
            elif echo "$MSG" | grep -qiE '^(perf|refactor)(\([^)]*\))?!?:'; then
              OPTIMIZATIONS="${OPTIMIZATIONS}\n- ${MSG}"
            elif echo "$MSG" | grep -qiE '(bugfix|修复|修正|bug)'; then
              FIXES="${FIXES}\n- ${MSG}"
            elif echo "$MSG" | grep -qiE '(performance|优化|改进|improve|optimization|性能|重构|提速|升级依赖|update|更新)'; then
              OPTIMIZATIONS="${OPTIMIZATIONS}\n- ${MSG}"
            elif echo "$MSG" | grep -qiE '(^feat|^add|feat:|add:|新增|添加|支持|新功能)'; then
              FEATURES="${FEATURES}\n- ${MSG}"
            else
              OTHERS="${OTHERS}\n- ${MSG}"
            fi
          done <<< "$COMMITS"

          NOTES=""
          [ -n "$FEATURES" ] && NOTES="${NOTES}## 新增功能\n${FEATURES}\n\n"
          [ -n "$FIXES" ]    && NOTES="${NOTES}## Bug 修复\n${FIXES}\n\n"
          [ -n "$OPTIMIZATIONS" ] && NOTES="${NOTES}## 优化\n${OPTIMIZATIONS}\n\n"
          [ -n "$OTHERS" ]   && NOTES="${NOTES}## 其他改动\n${OTHERS}\n\n"
          [ -z "$NOTES" ]    && NOTES="本次发布包含若干内部优化。\n"

          printf "%b" "$NOTES" > RELEASE_NOTES.md
          echo "--- 生成的版本说明 ---"
          cat RELEASE_NOTES.md

      - name: 3. 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. 安装 Expo 和 EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: '23.2.0'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 5. 安装项目依赖
        run: npm ci

      - name: 6. 触发 EAS 云端打包并抓取 APK
        id: eas-build
        run: |
          echo "开始提交云端构建任务..."
          BUILD_JSON=$(eas build --platform android --profile preview --non-interactive --json)
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          echo "云端打包成功！APK 链接: $APK_URL"
          wget -O jianji-release.apk "$APK_URL"

      - name: 7. 确认最终版本号
        id: get_version
        run: |
          APP_VERSION=$(jq -r '.expo.version' app.json)
          echo "version=v${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "最终版本号: v${APP_VERSION}"

      - name: 8. 发布到 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "见机 ${{ steps.get_version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: jianji-release.apk
